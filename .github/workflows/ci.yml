name: Polar CI
run-name: Polar CI · ${{ github.event_name }} · ${{ inputs.product_pr || github.event.pull_request.number || github.sha }}
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      product_pr:
        description: 'Current product PR number; resolve its live head at start'
        required: true
      test_path:
        description: 'Optional tests/ path or node ID; native control still runs'
        required: false
permissions:
  contents: read
concurrency:
  group: polar-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.product_pr || github.event.pull_request.number || github.sha }}
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCT_PR: ${{ inputs.product_pr || github.event.pull_request.number }}
        run: |
          HEAD=$CURRENT_SHA
          if [[ -n "$PRODUCT_PR" ]]; then
            [[ "$PRODUCT_PR" =~ ^[1-9][0-9]*$ ]]
            HEAD=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PRODUCT_PR" --jq '.head.sha')
            # A PR event is for this event's head, even if a newer head arrived.
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then HEAD=$CURRENT_SHA; fi
          fi
          [[ "$HEAD" =~ ^[a-f0-9]{40}$ ]]
          MATRIX=$(jq -nc --arg head "$HEAD" --arg pr "$PRODUCT_PR" '{include:[{name:(if $pr == "" then "current" else "product-pr-"+$pr end),sha:$head}]}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
  test:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout CI implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-tools
          persist-credentials: false
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.sha }}
          path: candidate
          persist-credentials: false
      - name: Record pending status
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ matrix.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" -f state=pending -f context='Polar CI / locked environment' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description='Exact candidate checkout selected; public/invented checks only'
      - name: Run shared author and QA command
        id: ci
        env:
          TEST_PATH: ${{ inputs.test_path }}
        run: |
          ARGS=()
          if [[ -n "$TEST_PATH" ]]; then ARGS+=(--test "$TEST_PATH"); fi
          ci-tools/scripts/ci.sh --source "$GITHUB_WORKSPACE/candidate" --reports "$GITHUB_WORKSPACE/ci-reports" "${ARGS[@]}"
      - name: ML ridge synthetic end-to-end
        id: ml
        if: always()
        run: |
          if [[ -f candidate/src/polar/reference_service.py ]]; then
            ci-tools/scripts/ci.sh --source "$GITHUB_WORKSPACE/candidate" --reports "$GITHUB_WORKSPACE/ci-reports-ml" --scenario ml-ridge
          else
            echo 'ML scenario NOT AVAILABLE on this historical selected candidate'
          fi
      - name: OBS158 synthetic end-to-end
        id: obs
        if: always()
        run: |
          if [[ -f candidate/src/polar/obs158_service.py ]]; then
            ci-tools/scripts/ci.sh --source "$GITHUB_WORKSPACE/candidate" --reports "$GITHUB_WORKSPACE/ci-reports-obs" --scenario obs158
          else
            echo 'OBS158 scenario NOT AVAILABLE on this historical selected candidate'
          fi
      - name: Scheduled no-fit synthetic end-to-end
        id: scheduled
        if: always()
        run: |
          if [[ -f candidate/src/polar/scheduled_service.py ]]; then
            ci-tools/scripts/ci.sh --source "$GITHUB_WORKSPACE/candidate" --reports "$GITHUB_WORKSPACE/ci-reports-scheduled" --scenario scheduled-policy
          else
            echo 'Scheduled scenario NOT AVAILABLE on this historical selected candidate'
          fi
      - name: Publish exact candidate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ matrix.sha }}
          OUTCOME: ${{ steps.ci.outcome }}
          ML_OUTCOME: ${{ steps.ml.outcome }}
          OBS_OUTCOME: ${{ steps.obs.outcome }}
          SCHEDULED_OUTCOME: ${{ steps.scheduled.outcome }}
        run: |
          STATE=failure
          if [[ "$OUTCOME" == success && "$ML_OUTCOME" == success && "$OBS_OUTCOME" == success && "$SCHEDULED_OUTCOME" == success ]]; then STATE=success; fi
          for report in ci-reports ci-reports-ml ci-reports-obs ci-reports-scheduled; do
            if [[ "$report" == ci-reports || -d "$report" ]]; then
              if ! jq -e --arg sha "$CANDIDATE_SHA" '.schema == "polar.ci-result/1" and .candidate_sha == $sha and .status == "PASS" and .exit == 0' "$report/result.json"; then STATE=failure; fi
            fi
          done
          if [[ -f ci-reports/result.json ]]; then cat ci-reports/result.json >> "$GITHUB_STEP_SUMMARY"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" -f state="$STATE" -f context='Polar CI / locked environment' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description='Shared locked command result; see exact SHA and diagnostics'
      - name: Retain bounded synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-${{ matrix.name }}-${{ matrix.sha }}
          path: |
            ci-reports/
            ci-reports-ml/
            ci-reports-obs/
            ci-reports-scheduled/
          retention-days: 7
          if-no-files-found: warn
