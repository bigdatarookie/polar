name: Polar isolated CI pilot
on:
  push:
    branches: ["ci/isolated-pilot-20261110-193545"]
permissions:
  contents: read
concurrency:
  group: polar-isolated-ci-pilot-${{ github.ref }}
  cancel-in-progress: false
env:
  PILOT_BASELINE_SHA: "ad20035efdd972778c0b1f48f43bf51f935a48d1"
  PILOT_NEGATIVE_CONTROL: "false"
jobs:
  package-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "ad20035efdd972778c0b1f48f43bf51f935a48d1"
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
      - name: Record baseline and runtime
        run: |
          mkdir -p pilot-results
          git rev-parse HEAD | tee pilot-results/source-commit.txt
          test "$(git rev-parse HEAD)" = "$PILOT_BASELINE_SHA"
          node --version | tee pilot-results/node-version.txt
      - name: Run existing package tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/test_polar_package.mjs 2>&1 | tee pilot-results/package-tests.tap
      - name: Deliberate negative control
        if: env.PILOT_NEGATIVE_CONTROL == 'true'
        run: node -e 'throw new Error("INTENTIONAL_CI_NEGATIVE_CONTROL")'
      - name: Preserve synthetic results on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pilot-package-results-${{ github.run_id }}
          path: pilot-results/
          retention-days: 2
          if-no-files-found: warn
  python-tests:
    if: ${{ !contains(github.event.head_commit.message, '[pilot-negative]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_CACHE_DIR: /tmp/polar-pilot-uv-cache
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "ad20035efdd972778c0b1f48f43bf51f935a48d1"
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.15"
      - name: Record baseline and bootstrap
        shell: bash
        run: |
          mkdir -p pilot-results
          git rev-parse HEAD | tee pilot-results/source-commit.txt
          test "$(git rev-parse HEAD)" = "$PILOT_BASELINE_SHA"
          python --version | tee pilot-results/bootstrap-python.txt
          python -m pip install --disable-pip-version-check uv==0.12.15 2>&1 | tee pilot-results/bootstrap.log
      - name: Install existing frozen project dependencies
        shell: bash
        run: |
          set -o pipefail
          uv sync --frozen --python "$(command -v python)" 2>&1 | tee pilot-results/dependencies.log
      - name: Import application using the test runtime
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/python -c 'import sys; import pyarrow; import polar.artifacts; import polar.service; print("python",sys.version); print("executable",sys.executable); print("pyarrow",pyarrow.__version__)' 2>&1 | tee pilot-results/import-smoke.log
      - name: Run existing synthetic financial component tests
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q tests/test_allocation.py tests/test_supplied_fills.py tests/test_feature_view.py --junitxml=pilot-results/python-tests.xml 2>&1 | tee pilot-results/python-tests.log
      - name: Preserve synthetic results on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pilot-python-results-${{ github.run_id }}
          path: pilot-results/
          retention-days: 2
          if-no-files-found: warn
