name: polar

x-app: &app
  image: polar-local:${POLAR_IMAGE_TAG:-fixture}
  build:
    context: .
    args:
      CODE_REVISION: ${POLAR_CODE_REVISION:?Set exact commit SHA}
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 100
  tmpfs: ["/tmp:mode=1777"]
  logging: &logs
    driver: json-file
    options: {max-size: 5m, max-file: "2"}

x-env: &env
  POLAR_DB_HOST: db
  POLAR_DB_PASSWORD_FILE: /run/secrets/db_password
  POLAR_ARTIFACT_ROOT: /data/artifacts
  POLAR_STORAGE_BYTES: ${POLAR_STORAGE_BYTES:-68719476736}
  POLAR_HISTORY_CURSOR_KEY_FILE: /run/secrets/history_cursor_key
  POLAR_IMAGE_REF: polar-local:${POLAR_IMAGE_TAG:-fixture}

services:
  db:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    pids_limit: 100
    environment:
      POSTGRES_DB: polar
      POSTGRES_USER: polar
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [db:/var/lib/postgresql/data]
    networks: [service]
    logging: *logs
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U polar -d polar"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    networks: [service]
    profiles: [tools]
    environment: *env
    secrets: [db_password]
    command: [python, -m, polar.cli, migrate]
    depends_on: {db: {condition: service_healthy}}

  api:
    <<: *app
    networks: [service, api_host]
    environment: *env
    secrets: [db_password, history_cursor_key]
    ports: ["127.0.0.1:${POLAR_API_PORT:-18080}:8000"]
    volumes: [artifacts:/data/artifacts:ro]
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *app
    networks: [service]
    environment: *env
    secrets: [db_password]
    volumes: [artifacts:/data/artifacts:rw]
    command: [python, -m, polar.worker]
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, -m, polar.cli, ready]
      interval: 10s
      timeout: 5s
      retries: 3

  evaluator:
    <<: *app
    profiles: [evaluation]
    network_mode: none
    environment: {}
    volumes:
      - ${POLAR_EVALUATOR_INPUT:?Select one immutable artifact directory}:/input:ro
      - evaluations:/output:rw
    command: [python, -m, polar.evaluator]

  snapshot:
    <<: *app
    profiles: [tools]
    network_mode: none
    environment: {}
    volumes: [artifacts:/data/artifacts:ro]
    command: [python, -c, "raise SystemExit('Use scripts/ops.py backup')"]

  restore-artifacts:
    <<: *app
    profiles: [tools]
    network_mode: none
    environment: {}
    volumes: [artifacts:/data/artifacts:rw]
    command: [python, -c, "raise SystemExit('Use scripts/ops.py restore')"]

networks:
  service:
    name: ${POLAR_NETWORK:-polar_fixture_service}
    internal: true
  api_host:
    name: ${POLAR_API_NETWORK:-polar_fixture_api}
    driver: bridge
    internal: false

volumes:
  db: {name: "${POLAR_DB_VOLUME:-polar_fixture_db}", labels: {polar.scope: POL.0.4.0.1}}
  artifacts: {name: "${POLAR_ARTIFACT_VOLUME:-polar_fixture_artifacts}", labels: {polar.scope: POL.0.4.0.1}}
  evaluations: {name: "${POLAR_EVALUATION_VOLUME:-polar_fixture_evaluations}", labels: {polar.scope: POL.0.4.0.1}}

secrets:
  history_cursor_key:
    file: ${POLAR_HISTORY_CURSOR_KEY_PATH:?Set persistent private history cursor key path}
  db_password:
    file: ${POLAR_DB_PASSWORD_PATH:?Set task-owned password file path}
